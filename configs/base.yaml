project:
  name: fatigue-recognition-system
  seed: 42
  timezone: Europe/Belgrade

data:
  raw_dir: data/raw
  processed_dir: data/processed
  labels_dir: data/labels
  splits_dir: data/splits

video:
  target_width: 1280
  target_height: 720
  target_fps: 25

activation:
  enabled: true
  sequence:
    - thumbs_up
    - peace_sign
    - ok_sign
  sequence_timeout_sec: 10.0
  max_gap_between_gestures_sec: 5.0
  cooldown_sec: 1.0

fatigue:
  mode: hybrid

  classical:
    ear_threshold: 0.25
    ear_consec_frames: 20
    mar_threshold: 0.55
    yawn_consec_frames: 15
    pitch_nod_threshold_deg: 18
    classifier_path: models/classical_classifier.pkl
  modern:
    model_path: models/fatigue_model.pt
    threshold: 0.60
    smoothing_window: 10

  # This matches HybridFatigueDetector
  hybrid:
    weight_classical: 0.55
    weight_modern: 0.45
    threshold: 0.55
    alarm_consec_frames: 4

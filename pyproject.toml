[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fatigue-recognition-system"
version = "0.1.0"
description = "Driver fatigue detection with gesture-based activation"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
